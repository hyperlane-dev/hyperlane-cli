[package]
name = "hyperlane-cli"
version = "0.1.21"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
description = """A command-line tool for Hyperlane framework."""
keywords = ["output", "console", "log", "print", "color"]
repository = "https://github.com/hyperlane-dev/hyperlane-cli"
categories = ["command-line-interface", "development-tools", "visualization"]
exclude = ["target", "Cargo.lock", "sh", ".github", "tmp"]

[[bin]]
name = "hyperlane"
path = "src/main.rs"

[dependencies]
toml = "0.9.12"
regex = "1.13.1"
thiserror = "2.0.19"
tokio = { version = "1.53.0", features = ["full"] }
log = "0.4.33"
which = "8.0.5"
notify = { version = "8.2.0", default-features = false, features = [
    "macos_fsevent",
] }
color-output = "10.0.7"
lombok-macros = "2.0.32"

[profile.dev]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"

[profile.release]
incremental = false
opt-level = 3
lto = true
panic = "unwind"
debug = false
codegen-units = 1
strip = "debuginfo"
